# SSI stack for the Empower-X marketplace (Ocean Enterprise compatible).
#
#   wallet-gateway  public https://wallet.zdevutils.com (nginx-proxy + Let's Encrypt)
#                   /wallet-api/* -> wallet-api, / -> web wallet UI
#   wallet-api      walt.id wallet backend (users log in with MetaMask)
#   waltid-dev-wallet   web wallet UI (MetaMask login; users manage credentials)
#   verifier-api    walt.id verifier (OpenID4VP)
#   opa-server      policy engine for custom policies (internal, TLS)
#   policy-server   Ocean Enterprise Policy Server  -> called by the Ocean node
#   policy-server-proxy  receives wallet presentations (internal)
#
# Deploy as a Portainer stack in "Repository" mode (compose path:
# deploy/ssi/docker-compose.yml) so the ./config build context is available.
# Public addresses are set below; only secrets (and LETSENCRYPT_EMAIL) come
# from the stack environment -- see stack.env.example.

name: ssi

x-restart: &restart
  restart: unless-stopped

services:
  # One-shot: renders ./config templates with this deployment's hosts/secrets
  # into the named volumes below, then exits.
  ssi-config:
    build: ./config
    image: empower-x/ssi-config:local
    restart: "no"
    environment:
      WALLET_HOST: wallet.zdevutils.com
      # Every domain the marketplace is served on (space separated).
      MARKET_ORIGINS: https://market-empower-x.zdevutils.com https://portal.empower-x.io
      WALLET_ENCRYPTION_KEY: ${WALLET_ENCRYPTION_KEY:?run scripts/generate-secrets.mjs}
      WALLET_SIGN_KEY: ${WALLET_SIGN_KEY:?run scripts/generate-secrets.mjs}
      WALLET_TOKEN_KEY: ${WALLET_TOKEN_KEY:?run scripts/generate-secrets.mjs}
      WALLET_AUTHNZ_JWK: ${WALLET_AUTHNZ_JWK:?run scripts/generate-secrets.mjs}
      WALLET_PEPPER: ${WALLET_PEPPER:?run scripts/generate-secrets.mjs}
    volumes:
      - wallet-config:/out/wallet-api
      - verifier-config:/out/verifier-api
      - gateway-config:/out/caddy
      - opa-certs:/out/opa-certs

  postgres:
    <<: *restart
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-waltid}
      POSTGRES_USER: ${DB_USERNAME:-waltid}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "${DB_USERNAME:-waltid}"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - wallet-db:/var/lib/postgresql/data

  wallet-api:
    <<: *restart
    image: waltid/wallet-api:${WALLET_API_VERSION:-gaiax-0.1.1-OE}
    depends_on:
      ssi-config:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      # Resolved by HOCON inside the config files.
      POSTGRES_DB_HOST: postgres
      POSTGRES_DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-waltid}
      DB_USERNAME: ${DB_USERNAME:-waltid}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wallet-config:/waltid-wallet-api/config:ro
      - wallet-data:/waltid-wallet-api/data

  waltid-dev-wallet:
    <<: *restart
    # Ocean Enterprise's web wallet: "Connect with MetaMask" uses the same
    # wallet-api login as the marketplace, so it is the same account/wallet.
    # (Its OIDC/DFNS/signer-server buttons need services we don't run.)
    image: oceanenterprise/waltid-dev-wallet:${DEV_WALLET_VERSION:-gaiax-0.1.5-OE}
    depends_on:
      - wallet-api
    environment:
      PORT: "7104"
      NUXT_PUBLIC_WALLET_API: https://wallet.zdevutils.com/wallet-api
      NUXT_WALLET_API_INTERNAL: http://wallet-api:7001/wallet-api
      NUXT_PUBLIC_ISSUER_CALLBACK_URL: https://wallet.zdevutils.com
      NUXT_PUBLIC_DEMO_WALLET_URL: https://wallet.zdevutils.com

  wallet-gateway:
    <<: *restart
    image: caddy:2
    depends_on:
      ssi-config:
        condition: service_completed_successfully
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: wallet.zdevutils.com
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: wallet.zdevutils.com
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - gateway-config:/etc/caddy:ro
    networks:
      - default
      - proxy

  verifier-api:
    <<: *restart
    image: waltid/verifier-api:${VERIFIER_API_VERSION:-gaiax-0.1.2-OE}
    depends_on:
      ssi-config:
        condition: service_completed_successfully
    environment:
      OPA_SERVER_URL: https://opa-server:8181
    volumes:
      - verifier-config:/waltid-verifier-api/config:ro

  opa-server:
    <<: *restart
    image: openpolicyagent/opa:${OPA_VERSION:-1.4.2}
    depends_on:
      ssi-config:
        condition: service_completed_successfully
    command:
      - run
      - --server
      - --addr
      - ":8181"
      - --tls-cert-file
      - /certs/tls.pem
      - --tls-private-key-file
      - /certs/tls.key
    volumes:
      - opa-certs:/certs:ro

  policy-server:
    <<: *restart
    # v1.3.2 is the last release for OE Node 3.x (see OE compatibility matrix).
    # Use v1.3.3+ only after the node is upgraded to 4.x.
    image: oceanenterprise/policy-server:${POLICY_SERVER_VERSION:-v1.3.2}
    environment: &policy-server-env
      AUTH_TYPE: waltid
      WALTID_VERIFIER_URL: http://verifier-api:7003
      # LAN address: the public node URLs are not reachable from inside the LAN
      # (the router has no NAT hairpin).
      OCEAN_NODE_URL: http://192.168.130.2:8000
      WALTID_SUCCESS_REDIRECT_URL: https://market-empower-x.zdevutils.com/success?id=$$id
      WALTID_ERROR_REDIRECT_URL: https://market-empower-x.zdevutils.com/error?id=$$id
      # Fetched/posted by the wallet backend server-side -> internal URLs.
      WALTID_VERIFY_RESPONSE_REDIRECT_URL: http://policy-server-proxy:3000/verify/$$id
      WALTID_VERIFY_PRESENTATION_DEFINITION_URL: http://policy-server-proxy:3000/pd/$$id
      DEFAULT_VP_POLICIES: expired,signature,revoked-status-list,not-before
      DEFAULT_VC_POLICIES: expired,signature,revoked-status-list,not-before
      OPA_SERVER: https://opa-server:8181
      ENABLE_LOGS: "1"
      PORT: "3000"
      MODE_PS: "1"
      MODE_PROXY: "0"
    # The Ocean node calls this (POLICY_SERVER_URL=http://<this-host>:<port>).
    # Bind to the LAN IP and/or firewall it: it must not be public.
    ports:
      - "${POLICY_SERVER_BIND:-0.0.0.0}:${POLICY_SERVER_PORT:-8001}:3000"

  policy-server-proxy:
    <<: *restart
    image: oceanenterprise/policy-server:${POLICY_SERVER_VERSION:-v1.3.2}
    environment:
      <<: *policy-server-env
      MODE_PS: "0"
      MODE_PROXY: "1"

volumes:
  wallet-config:
  verifier-config:
  gateway-config:
  opa-certs:
  wallet-db:
  wallet-data:

networks:
  default:
    name: ssi
  proxy:
    # The network nginx-proxy / acme-companion watch (same as the marketplace).
    name: ${PROXY_NETWORK:-docker_default}
    external: true
